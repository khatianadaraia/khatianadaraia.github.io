{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Clean DIN-style sans typography: Barlow throughout -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* One clean DIN-style sans-serif everywhere */
  body,
  .page__content,
  .page__content p,
  .page__content li,
  h1, h2, h3, h4, h5, h6,
  .masthead, .greedy-nav, .site-title,
  .author__name, .author__bio,
  .page__title, .page__meta,
  .archive__item-title, .btn {
    font-family: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Left-aligned reading text: even word spacing, compact rhythm */
  .page__content p,
  .page__content li {
    text-align: left;
    -webkit-hyphens: manual;
    -ms-hyphens: manual;
    hyphens: manual;
    line-height: 1.6;
  }
  .page__content p { margin-bottom: 0.9em; }
  .page__content li { margin-bottom: 0.35em; }
  .page__content ul { margin-top: 0.3em; margin-bottom: 1.1em; }
  .page__content h2 { margin-top: 1.4em; margin-bottom: 0.5em; font-size: 1.15em; border-bottom: none; }

  /* Keep the cat photo small and centred */
  .page__content p > img {
    display: block;
    max-width: 340px;
    width: 100%;
    margin: 1.2em auto 0.4em;
    border-radius: 4px;
  }
  .page__content .cat-caption {
    text-align: center;
    font-size: 0.85em;
    color: #666;
  }
</style>

<!-- end custom head snippets -->
